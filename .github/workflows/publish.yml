# Выкладка integram-mcp в npm.
#
# Этот файл — ОБРАЗЕЦ. Исполняется он не здесь, а в публичном зеркале
# judas-priest/integram-mcp как `.github/workflows/publish.yml`. Так требует
# npm trusted publishing: доверенным издателем объявляется конкретный воркфлоу
# конкретного репозитория, а provenance-подпись GitHub выдаёт только публичным.
#
# ЗЕРКАЛИРОВАНИЕ ЕГО НЕ КОПИРУЕТ. Пуш в `.github/workflows/` требует у токена
# права Workflows: write, а оно позволяет переписать любой воркфлоу зеркала —
# включая тот, что выкладывает в npm. Токену зеркала хватает Contents: write,
# и `sync-mcp-server.yml` каталог `.github` не трогает.
#
# Значит правка ЭТОГО файла сама в зеркало не уедет. Перенести руками:
#   cd <клон integram-mcp> && cp <монорепо>/mcp-server/mirror/publish.yml \
#     .github/workflows/publish.yml && git commit -am "publish workflow" && git push
# Токен для такого пуша обязан иметь scope `workflow`.
#
# Токена npm здесь нет и быть не должно. Проверка подлинности идёт по OIDC:
# GitHub выдаёт короткоживущий токен на один прогон, украсть и переиспользовать
# его нельзя. Отсюда `permissions: id-token: write` — без него OIDC не работает.
# Оговорка, которую стоит помнить: provenance доказывает, ГДЕ собрано, а не что
# исходник добросовестный, — коммит с закладкой проедет через настоящую подпись.
#
# Разовая настройка на npmjs.com (делается человеком, из браузера):
#   Package settings → Trusted publisher → GitHub Actions
#     Organization or user: judas-priest
#     Repository:           integram-mcp
#     Workflow filename:    publish.yml
#     Environment:          (пусто)
#   После этого — Publishing access → «Require two-factor authentication and
#   disallow tokens»: тогда выложить сможет только этот воркфлоу.

name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # обязательно для OIDC

jobs:
  publish:
    runs-on: ubuntu-latest   # OIDC не работает с self-hosted раннерами
    steps:
      - uses: actions/checkout@v4

      # Node 24: trusted publishing требует npm >= 11.5.1 и Node >= 22.14.
      # registry-url обязателен — без него OIDC не подхватывается.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Версия npm (нужна >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Согласованность версий
        run: npm test

      # Зеркало обновляется на каждую правку каталога, а выкладка нужна только
      # когда номер новый. Проверяем по реестру, а не по признаку «что-то
      # изменилось»: так прогон идемпотентен и повтор ничего не ломает.
      - name: Эта версия уже в npm?
        id: check
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if npm view "integram-mcp@$V" version >/dev/null 2>&1; then
            echo "Версия $V уже выложена — публиковать нечего."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Версии $V в реестре нет — публикуем."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Состав архива
        if: steps.check.outputs.publish == 'true'
        run: npm pack --dry-run

      # Флаг --provenance не нужен: при trusted publishing подпись ставится сама.
      - name: npm publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish

      # Выложенное обязано совпасть с исходником побайтно. Проверяем скачиванием
      # архива из реестра, а не доверием к тому, что publish отработал: под
      # неизменяемым адресом версии обязан лежать ровно тот файл, что собран.
      # npm после «Your package is being processed…» держит паузу заметно дольше
      # 25 секунд (замер 05.09.2026: 5 попыток по 5 с кончились раньше, чем
      # реестр начал отдавать архив), а пустой ответ `npm view` превращался в
      # пустой URL и «curl: (3) URL rejected» — потому пустоту проверяем явно.
      - name: Сверка выложенного с исходником
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.check.outputs.version }}"
          ok=0
          for i in $(seq 1 18); do
            sleep 10
            url=$(npm view "integram-mcp@$V" dist.tarball 2>/dev/null || true)
            if [ -n "$url" ] && curl -sSLf -o /tmp/pkg.tgz "$url"; then ok=1; break; fi
            echo "архив ещё не отдаётся, попытка $i"
          done
          if [ "$ok" != 1 ]; then
            echo "реестр не отдал архив integram-mcp@$V за 3 минуты" >&2
            exit 1
          fi
          a=$(sha1sum /tmp/pkg.tgz | cut -d' ' -f1)
          b=$(npm view "integram-mcp@$V" dist.shasum)
          if [ "$a" != "$b" ]; then
            echo "РАСХОЖДЕНИЕ shasum: скачан $a, в реестре $b" >&2
            exit 1
          fi
          echo "shasum $a — совпадает"
          rm -rf /tmp/pkgx && mkdir /tmp/pkgx && tar -xzf /tmp/pkg.tgz -C /tmp/pkgx
          # Перечень сверяемых файлов — из files (источник истины) плюс README.
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            console.log([...(pkg.files || []), "README.md"].join("\n"));
          ' | while IFS= read -r f; do
            a=$(sha256sum "/tmp/pkgx/package/$f" | cut -d' ' -f1)
            b=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$a" != "$b" ]; then
              echo "РАСХОЖДЕНИЕ в $f: в npm $a, в репозитории $b" >&2
              exit 1
            fi
            echo "$f: $a — совпадает"
          done
